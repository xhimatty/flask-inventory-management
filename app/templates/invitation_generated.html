{% extends 'base.html' %}
{% block title %}Generated Code{% endblock %}
{% block content %}
   <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4>Invitation Code Generated</h4>
                <p class="text-muted">
                    Share this code only with prospective employee. Expires in 24 hours.
                </p>

                <div class="alert alert-success">
                    <h5 class="text-center">{{ code }}</h5>
                </div>

                <a href="{{ url_for('auth.employees') }}" class="btn btn-success">&larr; Back to Employees</a>
            </div>
        </div>
   </div>
{% endblock %}
