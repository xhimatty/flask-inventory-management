{% extends 'base.html' %}
{% block title %}Method Not Allowed{% endblock %}
{% block content %}
<div class="ccontainer text-center mt-5">
    <h1 class="display-1 fw-bold text-success">405</h1>

    <h3>Method Not Allowed</h3>

    <p class="text-muted">
        The request method is not supported for this URL.
    </p>

    <a href="{{ url_for('main.home') }}" class="btn btn-sm btn-success mt-3">
        Return Home
    </a>
</div>
{% endblock %}
