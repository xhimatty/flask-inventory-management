{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="ccontainer text-center mt-5">
    <h1 class="display-1 fw-bold text-success">404</h1>

    <h3>Page Not Found</h3>

    <p class="text-muted">
        Sorry, this page you are looking for does not exist or may have been moved.
    </p>

    <a href="{{ url_for('main.home') }}" class="btn btn-sm btn-success mt-3">
        Return Home
    </a>
</div>
{% endblock %}
